<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Producto | Papelera Pierrastegui</title>

    <!-- tus css -->
    <link rel="stylesheet" href="/assets/css/productos.css">
    <link rel="stylesheet" href="/assets/css/dropcart.css">

    <!-- SUPABASE GLOBAL -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1.35.7"></script>

    <!-- TU SB -->
    <script>
        window.sb = supabase.createClient(
            "https://moacgzwrvegpoatwjqto.supabase.co",
            "TU_PUBLIC_KEY"
        );
    </script>
</head>

<body>

    <!-- ================= PRODUCTO ================= -->

    <main>
        <section class="producto container">

            <div class="producto-contenido">

                <img id="producto-img">

                <div class="producto-info">

                    <h2 id="producto-nombre"></h2>
                    <p id="producto-desc"></p>

                    <div id="drops-zone"></div>

                    <div class="agregar-carrito-cantidad">
                        <button id="menos">-</button>
                        <span id="cantidad">1</span>
                        <button id="mas">+</button>
                    </div>

                    <p id="totalText">Total: $0</p>

                    <button id="btnAdd" class="agregar-carrito">
                        Agregar al carrito
                    </button>

                </div>
            </div>
        </section>
    </main>


    <!-- ================= JS ================= -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {

            const sb = window.sb;

            const img = document.getElementById("producto-img");
            const nombre = document.getElementById("producto-nombre");
            const desc = document.getElementById("producto-desc");
            const zone = document.getElementById("drops-zone");
            const totalText = document.getElementById("totalText");
            const btnAdd = document.getElementById("btnAdd");

            const btnMas = document.getElementById("mas");
            const btnMenos = document.getElementById("menos");
            const cantidadEl = document.getElementById("cantidad");

            const params = new URLSearchParams(location.search);
            const id = params.get("id");

            if (!id) return alert("Producto sin ID");

            const { data: p } = await sb.from("productos").select("*").eq("id", id).single();

            if (!p) return alert("No existe");

            // ================= render base
            img.src = p.imagen || "";
            nombre.textContent = p.nombre;
            desc.textContent = p.descripcion;

            let cantidad = 1;
            let tipo = "unidad";
            let opt1 = null;
            let opt2 = null;

            const fmt = n => "$" + Number(n).toLocaleString("es-AR");

            function precioActual() {
                const baseU = p.precio_unidad || 0;
                const baseB = p.precio_bulto || 0;

                const u = opt1?.precio_unidad || baseU;
                const b = opt1?.precio_bulto || baseB;

                return tipo === "bulto" ? b : u;
            }

            function update() {
                totalText.textContent = "Total: " + fmt(precioActual() * cantidad);
            }

            // ================= dropdown builder
            function createDropdown(title, options, onSelect) {
                const wrap = document.createElement("select");
                wrap.className = "pp-select";

                wrap.innerHTML = `<option value="">${title}</option>`;

                options.forEach(o => {
                    const op = document.createElement("option");
                    op.textContent = o.label;
                    op.value = JSON.stringify(o);
                    wrap.appendChild(op);
                });

                wrap.onchange = () => {
                    const val = wrap.value;
                    if (!val) return;
                    onSelect(JSON.parse(val));
                    update();
                };

                zone.appendChild(wrap);
            }

            // dropdown 1
            if (p.dropdown1_options?.length) {
                createDropdown(
                    p.dropdown1_placeholder || "Seleccionar",
                    p.dropdown1_options,
                    o => {
                        opt1 = o;
                        if (o.img) img.src = o.img;
                    }
                );
            }

            // dropdown 2
            if (p.dropdown2_options?.length) {
                createDropdown(
                    p.dropdown2_placeholder || "Seleccionar",
                    p.dropdown2_options,
                    o => opt2 = o
                );
            }

            // tipo unidad/bulto
            if (p.precio_unidad || p.precio_bulto) {
                createDropdown(
                    "Tipo",
                    [
                        { label: "Unidad (1)", t: "unidad" },
                        { label: `Bulto (${p.bulto_cant || 1})`, t: "bulto" }
                    ],
                    o => tipo = o.t
                );
            }

            // ================= cantidad
            btnMas.onclick = () => {
                cantidad++;
                cantidadEl.textContent = cantidad;
                update();
            };

            btnMenos.onclick = () => {
                if (cantidad > 1) cantidad--;
                cantidadEl.textContent = cantidad;
                update();
            };

            // ================= carrito localStorage
            btnAdd.onclick = () => {

                const item = {
                    id: p.id,
                    nombre: p.nombre,
                    imagen: img.src,
                    cantidad,
                    tipo,
                    opt1: opt1?.label || null,
                    opt2: opt2?.label || null,
                    precio: precioActual()
                };

                const cart = JSON.parse(localStorage.getItem("cart") || "[]");
                cart.push(item);
                localStorage.setItem("cart", JSON.stringify(cart));

                alert("Agregado al carrito");
            };

            update();
        });
    </script>

</body>

</html>
