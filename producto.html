        <div class="mobile-item" id="mobile-cart">

    <!-- ================= HEADER ================= -->
    <header class="pp-header">

        <a href="/" class="pp-logo-link">
            <img class="pp-logo-img" src="https://mediastatic.papelerapierrastegui.com.ar/assets/images/favicon1.ico">
            <span class="pp-name">Papelera<br>Pierrastegui</span>
        </a>

        <div class="pp-search-bar">
            <input id="search-input" placeholder="Buscar productos...">
            <button class="pp-search-btn">
                <img src="https://papelerapierrastegui.com.ar/assets/images/svg/web/lupa.svg">
            </button>
        </div>

        <div class="pp-nav-links">

            <!-- CARRITO -->
            <div class="pp-cart dropcart-container">
                <button class="pp-cart-trigger" id="cart-toggle">
                    <span>Carrito</span>
                    <img src="https://papelerapierrastegui.com.ar/assets/images/svg/web/carrito.svg">
                    <span class="cart-badge" id="cart-badge">0</span>
                </button>

                <div class="dropcart" id="dropcart">
                    <div class="dropcart-header">
                        <strong>Tu Carrito</strong>
                        <button class="dropcart-close" id="dropcart-close">✕</button>
                    </div>
                    <div class="dropcart-items" id="dropcart-items"></div>
                    <div class="dropcart-footer">
                        <div class="dropcart-total">
                            <span>Total:</span>
                            <strong id="dropcart-total">$0</strong>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ACCOUNT -->
            <div id="account-container"></div>

        </div>
    </header>


    <!-- ================= NAV ================= -->
    <nav class="main-navbar">
        <div class="nav-items" id="desktopMenu"></div>
    </nav>


    <!-- ================= PRODUCTO ================= -->
    <main class="container producto-page">

        <div class="producto-layout">

            <div class="producto-media">
                <img id="producto-img">
            </div>

            <div class="producto-info">
                <h1 id="producto-nombre"></h1>
                <p id="producto-desc"></p>

                <button class="btn" id="addToCartBtn">
                    Agregar al carrito
                </button>
            </div>

        </div>

    </main>
