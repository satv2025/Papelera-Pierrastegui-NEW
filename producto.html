<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 🔥 mismos links que tus estáticos -->
    <link rel="stylesheet" href="https://papelerapierrastegui.com.ar/assets/css/productos.css">
    <link rel="stylesheet" href="https://papelerapierrastegui.com.ar/assets/css/dropcart.css">
    <link href="https://papelerapierrastegui.com.ar/assets/css/menucat-ind-pages.css" rel="stylesheet">
    <link href="https://papelerapierrastegui.com.ar/assets/css/login-ind-pages.css" rel="stylesheet">

    <title id="page-title">Producto | Papelera Pierrastegui</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1.35.7"></script>

    <script>
        window.sb = supabase.createClient(
            "https://moacgzwrvegpoatwjqto.supabase.co",
            "TU_ANON_KEY"
        );
    </script>
</head>

<body>

    <!-- =================================================
       🔥 TU HEADER REAL VA ACÁ (PEGALO IGUAL)
  ================================================= -->

    <main>
        <section class="producto container">

            <div class="producto-contenido">

                <!-- 🔥 mismos IDs/clases -->
                <img id="producto-img">

                <div class="producto-info">

                    <h2 id="producto-nombre"></h2>
                    <div id="producto-desc"></div>

                    <!-- dropdowns dinámicos -->
                    <div id="dynamic-dropdowns"></div>

                    <!-- cantidad (MISMO markup) -->
                    <div class="agregar-carrito-cantidad">
                        <button id="decrementar">-</button>
                        <span id="cantidad-visual">1</span>
                        <button id="incrementar">+</button>
                    </div>

                    <p class="total">Total: $0</p>

                    <button class="agregar-carrito">Agregar al Carrito</button>

                </div>
            </div>
        </section>
    </main>


    <!-- =================================================
       🔥 JS UNIVERSAL DINÁMICO
  ================================================= -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {

            const sb = window.sb;

            const img = document.getElementById("producto-img");
            const nombre = document.getElementById("producto-nombre");
            const desc = document.getElementById("producto-desc");
            const drops = document.getElementById("dynamic-dropdowns");

            const decBtn = document.getElementById("decrementar");
            const incBtn = document.getElementById("incrementar");
            const cantidadVisual = document.getElementById("cantidad-visual");
            const totalDisplay = document.querySelector(".total");
            const addBtn = document.querySelector(".agregar-carrito");

            const id = new URLSearchParams(location.search).get("id");
            if (!id) return alert("Falta ID de producto");

            const { data: p } = await sb.from("productos").select("*").eq("id", id).single();
            if (!p) return alert("Producto no encontrado");

            document.title = p.nombre + " | Papelera Pierrastegui";
            nombre.textContent = p.nombre;
            desc.textContent = p.descripcion || "";
            img.src = p.imagen || "";

            let cantidad = 1;
            let tipo = "unidad";
            let opt1 = null;
            let opt2 = null;

            const money = n => "$" + Number(n || 0).toLocaleString("es-AR");

            // =========================
            // PRECIO UNIVERSAL
            // =========================
            function getPrecio() {

                // si hay variante elegida
                if (opt1?.precio_unidad || opt1?.precio_bulto) {
                    return tipo === "bulto"
                        ? opt1.precio_bulto
                        : opt1.precio_unidad;
                }

                // fallback simple
                return tipo === "bulto"
                    ? (p.precio_bulto || 0)
                    : (p.precio_unidad || 0);
            }

            function updateTotal() {
                totalDisplay.textContent = "Total: " + money(getPrecio() * cantidad);
            }

            // =========================
            // DROPDOWN DINÁMICO (MISMO CSS)
            // =========================
            function crearDropdown({ placeholder, opciones, onSelect }) {

                const wrap = document.createElement("div");
                wrap.className = "dropdown";

                wrap.innerHTML = `
          <button class="dropdown-btn">
            <span class="text">${placeholder}</span>
            <span class="arrow">▼</span>
          </button>
          <div class="dropdown-menu"></div>
        `;

                const btn = wrap.querySelector(".dropdown-btn");
                const menu = wrap.querySelector(".dropdown-menu");

                btn.onclick = () => menu.classList.toggle("active");

                opciones.forEach(o => {
                    const item = document.createElement("div");
                    item.className = "dropdown-item";
                    item.textContent = o.label;

                    item.onclick = () => {
                        btn.querySelector(".text").textContent = o.label;
                        menu.classList.remove("active");
                        onSelect(o);
                        updateTotal();
                    };

                    menu.appendChild(item);
                });

                return wrap;
            }

            // =========================
            // RENDER VARIANTES
            // =========================
            const v = p.variantes || {};

            // DROP1 (tamaño/color/etc)
            if (v.dropdowns?.drop1?.options?.length) {
                drops.appendChild(
                    crearDropdown({
                        placeholder: v.dropdowns.drop1.placeholder || "Seleccionar",
                        opciones: v.dropdowns.drop1.options,
                        onSelect: o => {
                            opt1 = o;
                            if (o.img) img.src = o.img;
                        }
                    })
                );
            }

            // DROP2 (tipo unidad/bulto)
            if (v.dropdowns?.drop2?.options?.length) {
                drops.appendChild(
                    crearDropdown({
                        placeholder: v.dropdowns.drop2.placeholder || "Tipo",
                        opciones: v.dropdowns.drop2.options,
                        onSelect: o => tipo = o.meta || "unidad"
                    })
                );
            }

            // =========================
            // CANTIDAD
            // =========================
            incBtn.onclick = () => {
                cantidad++;
                cantidadVisual.textContent = cantidad;
                updateTotal();
            };

            decBtn.onclick = () => {
                if (cantidad > 1) cantidad--;
                cantidadVisual.textContent = cantidad;
                updateTotal();
            };

            // =========================
            // CARRITO
            // =========================
            addBtn.onclick = () => {

                const item = {
                    id: p.id,
                    nombre: p.nombre,
                    imagen: img.src,
                    cantidad,
                    tipo,
                    opt1: opt1?.label || null,
                    opt2: opt2?.label || null,
                    precio: getPrecio()
                };

                const cart = JSON.parse(localStorage.getItem("cart") || "[]");
                cart.push(item);
                localStorage.setItem("cart", JSON.stringify(cart));

                alert("Agregado al carrito");
            };

            updateTotal();
        });
    </script>

    <script type="module" src="https://papelerapierrastegui.com.ar/assets/js/ppUniversalCart.js"></script>

</body>

</html>
