<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Registro - Papelería Pierrastegui</title>
    <link rel="stylesheet" href="https://papelerapierrastegui.com.ar/assets/css/reg_logueo_pp.css">
</head>

<body>
    <div class="auth-page">
        <div class="form-container">
            <h2>CREA TU CUENTA</h2>

            <!-- Campos personalizados -->
            <div id="nombre" class="custom-input" contenteditable="true" data-placeholder="Nombre completo"
                tabindex="0"></div>
            <div id="username" class="custom-input" contenteditable="true" data-placeholder="Usuario" tabindex="0">
            </div>
            <div id="email" class="custom-input" contenteditable="true" data-placeholder="Correo electrónico"
                tabindex="0"></div>
            <div id="password" class="custom-input" contenteditable="true" data-placeholder="Contraseña" tabindex="0">
            </div>

            <button id="btn-register" type="button">Registrarse</button>

            <div class="form-divider"></div>

            <button id="btn-register-google" type="button" class="btn-ghost">
                Registrarse con Google
            </button>

            <p>¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
        </div>
    </div>

    <script type="module" src="https://papelerapierrastegui.com.ar/assets/js/auth.js"></script>
</body>

</html>
