<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Registro - Papelería Pierrastegui</title>
    <link rel="stylesheet" href="https://papelerapierrastegui.com.ar/assets/css/reg_logueo_pp.css">
</head>

<body>
    <div class="form-container">
        <h2>REGÍSTRATE</h2>

        <input id="username" type="text" placeholder="Nombre de usuario" required />
        <input id="nombre" type="text" placeholder="Nombre completo" required />
        <input id="email" type="email" placeholder="Correo electrónico" required />
        <input id="password" type="password" placeholder="Contraseña" required />
        <button id="btn-register" type="button">Registrarse</button>

        <div class="separator">o</div>

        <button id="btn-register-google" type="button" class="google-btn">
            Registrarse con Google
        </button>

        <p>¿Ya tienes una cuenta? <a href="/login">Inicia sesión</a></p>
    </div>

    <!-- Script de autenticación -->
    <script type="module" src="https://papelerapierrastegui.com.ar/assets/js/auth.js"></script>
</body>

</html>
