<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="https://papelerapierrastegui.com.ar/assets/css/reg_logueo_pp.css">
</head>

<body>
    <div class="form-container">
        <h2>CREA TU CUENTA</h2>

        <div id="register-fields">
            <div class="custom-input" data-key="username" placeholder="Nombre de usuario"></div>
            <div class="custom-input" data-key="email" placeholder="Correo electrónico"></div>
            <div class="custom-input" data-key="password" placeholder="Contraseña" data-password="true"></div>
            <div class="custom-input" data-key="confirm" placeholder="Confirmar contraseña" data-password="true"></div>
            <button id="btn-register">Registrarse</button>
            <button id="btn-login-page">Ir a Login</button>
        </div>
    </div>

    <script type="module" src="https://papelerapierrastegui.com.ar/assets/js/auth.js"></script>
    <script type="module" src="https://papelerapierrastegui.com.ar/assets/js/togglePassword.js"></script>
</body>

</html>
