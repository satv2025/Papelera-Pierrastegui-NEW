<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Productos</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        #productForm {
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        input,
        textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
        }

        button {
            padding: 10px 15px;
            margin-top: 10px;
            cursor: pointer;
        }

        .product {
            background: white;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 8px;
        }

        .product button {
            margin-right: 5px;
        }
    </style>
</head>

<body>

    <h1>Panel de Administración - Productos</h1>

    <div id="productForm">
        <h2>Agregar Producto</h2>
        <input type="text" id="title" placeholder="Título">
        <textarea id="description" placeholder="Descripción"></textarea>
        <input type="number" id="price" placeholder="Precio">
        <button onclick="createProduct()">Agregar Producto</button>
    </div>

    <h2>Productos Existentes</h2>
    <div id="products"></div>

    <script>
        const SPACE_ID = 'rkzndmb5t5yr';
        const ENVIRONMENT = 'master';
        const CONTENT_TYPE = 'Productos PP';
        const MANAGEMENT_TOKEN = 'CFPAT-m-Uf479RifoztHkV25RVb-w7O4wTCg1ENquwGNuA6zc'; // reemplaza con tu token

        // Fetch y mostrar productos
        async function loadProducts() {
            const res = await fetch(`https://cdn.contentful.com/spaces/${SPACE_ID}/environments/${ENVIRONMENT}/entries?access_token=GqaEC_bH9PQ8BZbuxXdpbP4Bkn6MALlui5MePbDty6Y&content_type=${CONTENT_TYPE}`);
            const data = await res.json();
            const container = document.getElementById('products');
            container.innerHTML = '';

            data.items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'product';
                div.innerHTML = `
            <strong>${item.fields.title['en-US']}</strong><br>
            ${item.fields.description['en-US']}<br>
            Precio: $${item.fields.price ? item.fields.price['en-US'] : '0'}<br>
            <button onclick="editProduct('${item.sys.id}')">Editar</button>
            <button onclick="deleteProduct('${item.sys.id}', '${item.sys.version}')">Borrar</button>
        `;
                container.appendChild(div);
            });
        }

        // Crear producto usando Content Management API
        async function createProduct() {
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const price = parseFloat(document.getElementById('price').value);

            const res = await fetch(`https://api.contentful.com/spaces/${SPACE_ID}/environments/${ENVIRONMENT}/entries`, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + MANAGEMENT_TOKEN,
                    'Content-Type': 'application/vnd.contentful.management.v1+json',
                    'X-Contentful-Content-Type': CONTENT_TYPE
                },
                body: JSON.stringify({
                    fields: {
                        title: { 'en-US': title },
                        description: { 'en-US': description },
                        price: { 'en-US': price }
                    }
                })
            });

            const data = await res.json();
            alert('Producto creado: ' + data.sys.id);
            loadProducts();
        }

        // Editar producto (solo ejemplo simple de prompt)
        async function editProduct(id) {
            const newTitle = prompt('Nuevo título:');
            if (!newTitle) return;

            // Primero obtenemos la versión actual
            const entryRes = await fetch(`https://api.contentful.com/spaces/${SPACE_ID}/environments/${ENVIRONMENT}/entries/${id}`, {
                headers: { 'Authorization': 'Bearer ' + MANAGEMENT_TOKEN }
            });
            const entryData = await entryRes.json();

            // Actualizamos
            await fetch(`https://api.contentful.com/spaces/${SPACE_ID}/environments/${ENVIRONMENT}/entries/${id}`, {
                method: 'PUT',
                headers: {
                    'Authorization': 'Bearer ' + MANAGEMENT_TOKEN,
                    'Content-Type': 'application/vnd.contentful.management.v1+json',
                    'X-Contentful-Version': entryData.sys.version
                },
                body: JSON.stringify({
                    fields: {
                        title: { 'en-US': newTitle }
                    }
                })
            });

            alert('Producto actualizado');
            loadProducts();
        }

        // Borrar producto
        async function deleteProduct(id, version) {
            if (!confirm('¿Seguro quieres borrar este producto?')) return;

            await fetch(`https://api.contentful.com/spaces/${SPACE_ID}/environments/${ENVIRONMENT}/entries/${id}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': 'Bearer ' + MANAGEMENT_TOKEN,
                    'X-Contentful-Version': version
                }
            });

            alert('Producto borrado');
            loadProducts();
        }

        // Carga inicial
        loadProducts();
    </script>

</body>

</html>
