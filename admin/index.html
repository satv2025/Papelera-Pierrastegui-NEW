<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel De Administración - Papelera Pierrastegui</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon1.ico">

    <style>
        /* Importar fuentes */
        @import url('https://fuentes.solargentinotv.com.ar/importgilroy.css');
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        :root {
            --primary-color: #3b2d00;
            --text-color: #333;
            --background-color: #E1DABD;
            --neon-green: #37ff14;
            --shadow: 0 4px 14px rgba(0, 0, 0, 0);
        }

        * {
            font-family: 'Gilroy';
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-size: 1em;
            line-height: 1.7;
        }

        header {
            background-color: var(--background-color);
            color: var(--primary-color);
            padding: 20px 40px;
            text-align: center;
            border-bottom: 3px solid var(--primary-color);
        }

        header h1 {
            font-size: 2em;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Contenedor CMS */
        #cms {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            box-shadow: var(--shadow);
            border-radius: 10px;
        }

        footer {
            background-color: var(--background-color);
            color: var(--primary-color);
            text-align: center;
            border-top: 3px solid var(--primary-color);
            padding: 2em 0;
            margin-top: 4em;
        }
    </style>
</head>

<body>

    <header>
        <h1>Panel De Administración / Papelera Pierrastegui</h1>
    </header>

    <main id="cms">
        <!-- Netlify CMS se cargará aquí -->
    </main>

    <footer>
        &copy; 2025 Papelera Pierrastegui
    </footer>

    <!-- Netlify CMS -->
    <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>
    <script>
        CMS.init({ config: '/admin/config.yml' });
    </script>

</body>

</html>
