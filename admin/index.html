<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel De Administración - Papelera Pierrastegui</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon1.ico">

    <style>
        @import url('https://fuentes.solargentinotv.com.ar/importgilroy.css');
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro&family=Inter&family=Poppins&display=swap');

        :root {
            --primary-color: #3b2d00;
            --text-color: #3b2d00;
            --background-color: #E1DABD;
            --shadow: 0 4px 14px rgba(0, 0, 0, 0);
        }

        * {
            font-family: 'Gilroy' !important;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--background-color);
            color: #3b2d00;
            font-size: 1em;
            line-height: 1.7;
        }

        header {
            background-color: var(--background-color);
            color: var(--primary-color);
            padding: 20px 40px;
            text-align: center;
            border-bottom: 3px solid var(--primary-color);
        }

        header h1 {
            font-size: 2em;
            font-weight: 700;
            letter-spacing: 1px;
        }

        #cms {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            box-shadow: var(--shadow);
            border-radius: 10px;
        }

        footer {
            background-color: var(--background-color);
            color: var(--primary-color);
            text-align: center;
            border-top: 3px solid var(--primary-color);
            padding: 2em 0;
            margin-top: 4em;
        }

        .product {
            border-bottom: 1px solid #ccc;
            padding: 1em 0;
        }

        .product img {
            max-width: 150px;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Panel De Administración / Papelera Pierrastegui</h1>
    </header>

    <main id="cms">
        <h2>Productos cargando...</h2>
    </main>

    <footer>&copy; 2025 Papelera Pierrastegui</footer>

    <script>
        const space = "rkzndmb5t5yr";
        const accessToken = "FO78aByStLLG2_vw1Q1rf6f79s-hRS42lDZLoq8e5F0";
        const contentType = "products"; // El content_type que creaste en Contentful

        async function loadProducts() {
            const container = document.getElementById('cms');
            container.innerHTML = "<h2>Cargando productos...</h2>";
            try {
                const res = await fetch(`https://cdn.contentful.com/spaces/${space}/entries?access_token=${accessToken}&content_type=${contentType}`);
                const data = await res.json();
                container.innerHTML = ""; // limpiar mensaje de carga
                data.items.forEach(item => {
                    const fields = item.fields;
                    const imgUrl = fields.image?.fields?.file?.url;
                    const div = document.createElement('div');
                    div.className = "product";
                    div.innerHTML = `
                        <h3>${fields.title}</h3>
                        <p>${fields.description}</p>
                        <p>Precio: $${fields.price || '0'}</p>
                        ${imgUrl ? `<img src="${imgUrl}" alt="${fields.title}">` : ''}
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                container.innerHTML = "<p>Error cargando productos.</p>";
                console.error(err);
            }
        }

        loadProducts();
    </script>
</body>

</html>
