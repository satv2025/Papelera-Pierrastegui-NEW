<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Papelera Pierrastegui</title>

    <!-- FUENTES -->
    <style>
        @import url('https://solargentinotv.com.ar/assets/fonts/Gilroy/Gilroy.css');

        :root {
            --primary: #ff7600;
            --dark: #3b2d00;
            --bg: #f7f7f7;
        }

        body {
            margin: 0;
            font-family: "Gilroy", sans-serif;
            background: var(--bg);
        }

        /* ================= HEADER ================= */

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 40px;
            background: white;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .06);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: 800;
            font-size: 22px;
            color: var(--dark);
            text-decoration: none;
        }

        .search {
            width: 40%;
        }

        .search input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 20px;
            align-items: center;
            cursor: pointer;
        }

        .cart-badge {
            background: var(--primary);
            color: white;
            border-radius: 50%;
            padding: 3px 8px;
            font-size: 12px;
            margin-left: 6px;
        }

        /* ================= GRID ================= */

        .productos-grid {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 22px;
        }

        .card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .05);
            transition: .2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, .12);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            background: #fff;
            padding: 10px;
        }

        .info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nombre {
            font-weight: 700;
            font-size: 15px;
        }

        .desc {
            font-size: 13px;
            color: #666;
            height: 32px;
            overflow: hidden;
        }

        .cat {
            font-size: 12px;
            color: var(--primary);
            font-weight: 600;
        }

        /* loader */
        .loader {
            text-align: center;
            margin: 60px;
            font-weight: 600;
            color: #999;
        }
    </style>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>
        <a class="logo" href="/">Papelera Pierrastegui</a>

        <div class="search">
            <input id="search-input" placeholder="Buscar productos..." />
        </div>

        <div class="actions">
            <div id="login-btn">Mi cuenta</div>

            <div id="cart-toggle">
                🛒
                <span id="cart-badge" class="cart-badge">0</span>
            </div>
        </div>
    </header>


    <!-- ================= GRID ================= -->

    <div id="productos-grid" class="productos-grid"></div>
    <div id="loader" class="loader">Cargando productos...</div>


    <!-- ================= SUPABASE ================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn-db.papelerapierrastegui.com.ar/assets/js/ppSupabase.js"></script>


    <!-- ================= APP ================= -->

    <script>
        const grid = document.getElementById("productos-grid");
        const searchInput = document.getElementById("search-input");
        const loader = document.getElementById("loader");

        let productos = [];

        const slugify = str =>
            str.toLowerCase().replace(/\s+/g, "-");

        /* ================= CARGAR PRODUCTOS ================= */

        async function cargarProductos() {
            const { data, error } = await sb
                .from("productos")
                .select("*")
                .eq("activo", true)
                .order("orden");

            loader.style.display = "none";

            if (error) {
                grid.innerHTML = "Error cargando productos";
                return;
            }

            productos = data;
            render(productos);
        }

        /* ================= RENDER ================= */

        function render(list) {
            grid.innerHTML = "";

            if (!list.length) {
                grid.innerHTML = "<p>No se encontraron productos</p>";
                return;
            }

            list.forEach(p => {
                const slug = p.slug || slugify(p.nombre);

                grid.insertAdjacentHTML("beforeend", `
    <div class="card"
      onclick="location.href='https://papelerapierrastegui.com.ar/producto?name=${slug}&id=${p.id}'">

      <img src="${p.imagen || 'https://via.placeholder.com/300x300?text=Sin+imagen'}">

      <div class="info">
        <div class="nombre">${p.nombre}</div>
        <div class="desc">${p.descripcion || ''}</div>
        <div class="cat">${p.categoria || ''}</div>
      </div>
    </div>
  `);
            });
        }

        /* ================= BUSCADOR ================= */

        searchInput.oninput = () => {
            const q = searchInput.value.toLowerCase();

            const filtrados = productos.filter(p =>
                p.nombre.toLowerCase().includes(q) ||
                (p.descripcion || "").toLowerCase().includes(q) ||
                (p.categoria || "").toLowerCase().includes(q)
            );

            render(filtrados);
        };

        /* ================= LOGIN SIMPLE ================= */

        document.getElementById("login-btn").onclick = () => {
            location.href = "/login.html";
        };

        /* ================= INIT ================= */

        cargarProductos();
    </script>

</body>

</html>
