<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout — Papelería Pierrastegui</title>
    <link rel="icon" href="https://mediastatic.papelerapierrastegui.com.ar/assets/images/favicon.png">
    <link rel="stylesheet" href="https://papelerapierrastegui.com.ar/assets/css/inicio.css">

    <style>
        body {
            background: #fff;
            font-family: "Poppins", sans-serif;
        }

        .checkout-container {
            max-width: 1000px;
            margin: 3em auto;
            background: #fff;
            border: 3px solid #ff7600;
            padding: 2em;
            border-radius: 8px;
        }

        .checkout-title {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 1em;
            color: #ff7600;
            text-align: center;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2em;
            margin-top: 2em;
        }

        .checkout-box {
            border: 2px solid #ff7600;
            border-radius: 8px;
            padding: 1.5em;
            background: #fff;
        }

        .checkout-box h3 {
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 1em;
            color: #ff7600;
        }

        .checkout-items {
            max-height: 380px;
            overflow-y: auto;
        }

        .checkout-item {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding: .8em 0;
            gap: 1em;
        }

        .checkout-item img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border: 1px solid #eee;
            border-radius: 4px;
        }

        .checkout-item-info {
            flex: 1;
            color: #000;
            font-weight: 600;
        }

        .checkout-totals div {
            display: flex;
            justify-content: space-between;
            font-size: 1.15em;
            font-weight: 700;
            margin: .3em 0;
        }

        input.checkout-input {
            width: 100%;
            border: 2px solid #ff7600;
            padding: .6em;
            border-radius: 6px;
            margin-bottom: .7em;
            font-weight: 700;
            color: #ff7600;
        }

        .checkout-btn {
            width: 100%;
            padding: .9em;
            background: #ff7600;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 1em;
        }

        .checkout-btn:hover {
            background: #ffc52f;
            color: #000;
        }

        .loader {
            display: none;
            text-align: center;
            margin-top: 1em;
            font-weight: 700;
        }

        .envio-opciones {
            display: flex;
            flex-direction: column;
            gap: 1em;
            margin-bottom: 1.5em;
        }

        .envio-opcion {
            border: 3px solid #ff7600;
            border-radius: 12px;
            padding: 1.2em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.2s ease;
        }

        .envio-opcion.activa {
            background: #fff5eb;
            box-shadow: 0 0 10px rgba(255, 118, 0, 0.3);
        }

        .envio-opcion span.retiro {
            color: #ff7600;
        }

        .envio-opcion span.gratis {
            color: #28a745;
        }

        .envio-opcion span.envio {
            color: #007bff;
        }

        .envio-opcion span.costo {
            color: #000;
        }
    </style>
</head>

<body>
    <header>
        <div id="pp-logo">
            <a href="/"><img src="https://mediastatic.papelerapierrastegui.com.ar/assets/images/favicon.png"></a>
        </div>
        <nav class="nav-links">
            <a href="/">Inicio</a>
            <a href="/productos">Productos</a>
        </nav>
    </header>

    <div class="checkout-container">
        <div class="checkout-title">Finalizar compra</div>

        <div id="checkout-error" style="color:red;font-weight:700;margin-bottom:1em;"></div>

        <div class="checkout-grid">
            <!-- LISTA ITEMS -->
            <div class="checkout-box">
                <h3>Tu pedido</h3>
                <div class="checkout-items" id="checkout-items"></div>
            </div>

            <!-- DATOS -->
            <div class="checkout-box">
                <h3>Datos para la entrega</h3>
                <input class="checkout-input" id="chk-nombre" placeholder="Nombre y apellido">
                <input class="checkout-input" id="chk-telefono" placeholder="Teléfono">
                <input class="checkout-input" id="chk-direccion" placeholder="Dirección">
                <input class="checkout-input" id="chk-localidad" placeholder="Localidad">

                <h3>Método de entrega</h3>
                <div class="envio-opciones">
                    <div class="envio-opcion activa" data-metodo="retiro">
                        <span class="retiro">Retiro En Tienda</span>
                        <span class="gratis">Gratis</span>
                    </div>
                    <div class="envio-opcion" data-metodo="envio">
                        <span class="envio">Envío a Domicilio</span>
                        <span class="costo" id="envio-costo-texto">Calculando...</span>
                    </div>
                </div>

                <hr style="margin:1em 0;border-color:#ff7600">
                <div id="checkout-totals" class="checkout-totals"></div>

                <button class="checkout-btn" id="btn-pagar">Pagar con MercadoPago</button>
                <div id="checkout-loader" class="loader">Procesando pago...</div>
            </div>
        </div>
    </div>

    <script type="module" src="assets/js/checkout.js"></script>
</body>

</html>
