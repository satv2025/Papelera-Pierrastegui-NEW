<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout — Papelera Pierrastegui</title>
    <link rel="icon" href="https://mediastatic.papelerapierrastegui.com.ar/assets/images/favicon.png" />
    <link rel="stylesheet" href="https://papelerapierrastegui.com.ar/assets/css/checkout.css" />
    <style>
        #direccion-sugerencias {
            border: 2px solid #ff7600;
            border-radius: 8px;
            margin-top: .3em;
            background: #fff;
            max-height: 180px;
            overflow-y: auto;
            display: none;
            position: absolute;
            width: 100%;
            z-index: 1000;
        }

        #direccion-sugerencias div {
            padding: .5em .7em;
            cursor: pointer;
            font-weight: 600;
        }

        #direccion-sugerencias div:hover {
            background: #fff5eb;
        }

        .aviso-arg {
            background: #fff8ef;
            border: 2px solid #ff7600;
            padding: .7em;
            border-radius: 8px;
            margin-bottom: 1em;
            color: #000;
            font-weight: 700;
            text-align: center;
        }

        .direccion-wrapper {
            position: relative;
        }
    </style>
</head>

<body>
    <header>
        <div id="pp-logo">
            <a href="/"><img src="https://mediastatic.papelerapierrastegui.com.ar/assets/images/favicon.png" /></a>
            <span class="pp-title">Papelera<br />Pierrastegui</span>
        </div>
        <nav class="nav-links">
            <a href="/">Inicio</a>
        </nav>
    </header>

    <div class="checkout-container">
        <div class="checkout-title">Finalizar compra</div>
        <div class="aviso-arg">🚚 Envíos disponibles únicamente dentro de <b>Argentina</b>.</div>

        <div id="checkout-error" style="color:red;font-weight:700;margin-bottom:1em;"></div>

        <div class="checkout-grid">
            <!-- LISTA DE ITEMS -->
            <div class="checkout-box">
                <h3>Tu pedido</h3>
                <div class="checkout-items" id="checkout-items"></div>
            </div>

            <!-- DATOS DE ENTREGA -->
            <div class="checkout-box">
                <h3>Datos del comprador</h3>
                <input class="checkout-input" id="chk-nombre" placeholder="Nombre y apellido" />
                <input class="checkout-input" id="chk-email" placeholder="Correo electrónico" type="email" />
                <input class="checkout-input" id="chk-telefono" placeholder="Teléfono" />

                <h3>Método de entrega</h3>
                <div class="envio-opciones">
                    <div class="envio-opcion activa" data-metodo="retiro">
                        <span class="retiro">Retiro en Tienda</span>
                        <span class="gratis">Gratis</span>
                    </div>
                    <div class="envio-opcion" data-metodo="envio">
                        <span class="envio">Envío a Domicilio</span>
                        <span class="costo" id="envio-costo-texto">Ingresá tu dirección</span>
                    </div>
                </div>

                <!-- Campo Dirección con sugerencias -->
                <div id="direccion-container" style="display:none;">
                    <div class="direccion-wrapper">
                        <input class="checkout-input" id="chk-direccion"
                            placeholder="Ejemplo: Av. Rivadavia 1234, Morón" />
                        <div id="direccion-sugerencias"></div>
                    </div>
                </div>

                <hr style="margin:1em 0;border-color:#ff7600" />
                <div id="checkout-totals" class="checkout-totals"></div>

                <button class="checkout-btn" id="btn-pagar">Pagar con MercadoPago</button>
                <div id="checkout-loader" class="loader" style="display:none;">Procesando pago...</div>
            </div>
        </div>
    </div>

    <script type="module" src="https://papelerapierrastegui.com.ar/assets/js/checkout.js"></script>
</body>

</html>
