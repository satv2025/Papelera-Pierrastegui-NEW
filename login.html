<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Iniciar Sesión - Papelería Pierrastegui</title>
    <link rel="stylesheet" href="https://papelerapierrastegui.com.ar/assets/css/reg_logueo_pp.css" />
    <link rel="icon" href="https://mediastatic.papelerapierrastegui.com.ar/assets/images/favicon.png"
        type="image/x-icon">
</head>

<body>
    <div class="auth-page">
        <div class="form-container">
            <h2>INICIA SESIÓN</h2>

            <input id="email" type="email" placeholder="Correo electrónico" required />
            <input id="password" type="password" placeholder="Contraseña" required />

            <button id="btn-login" type="button">Iniciar Sesión</button>

            <div class="form-divider"></div>

            <button id="btn-login-google" type="button" class="btn-ghost"><img
                    src="https://mediastatic.papelerapierrastegui.com.ar/assets/images/svg/web/google-favicon.png">
                Iniciar sesión con Google
            </button>

            <p>
                ¿No tienes cuenta?
                <a href="/register">Regístrate</a>
            </p>
        </div>
    </div>

<footer class="pp-footer">
        <p class="copyr">
            © 2026 Papelera Pierrastegui · Todos los derechos reservados
        </p>

        <div class="copyp">
    Powered by 
    <span class="satvbrand-text" onclick="window.location.href='https://solargentinotv.com.ar'">
        <span class="satvtexto">Sol Argentino TV</span>
        <img class="satvbrand-img" alt="texto" src="https://api.entrevoces.com.ar/storage/v1/object/public/portadas/logosatvpowered.png">
    </span>
</div>

        <div class="footer-links">
            <a class="footer-btn" href="https://solargentinotv.com.ar/contacto" target="_blank">
                Contacto
            </a>

            <a class="footer-btn" href="https://solargentinotv.com.ar" target="_blank">
                Sitio web
            </a>
        </div>
    </footer>

    <script type="module" src="assets/js/auth.js"></script>
</body>

</html>
