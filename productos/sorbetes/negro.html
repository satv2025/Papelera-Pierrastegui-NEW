<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorbetes Negros - Papelera Pierrastegui</title>
  <link rel="icon" href="https://mediastatic.papelerapierrastegui.com.ar/assets/images/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="https://papelerapierrastegui.com.ar/assets/css/productos.css">
</head>

<body>
  <header>
    <h1>Papelera Pierrastegui</h1>
    <nav>
      <ul>
        <li><a href="https://papelerapierrastegui.com.ar/index">Inicio</a></li>
        <li><a href="https://papelerapierrastegui.com.ar/catalogo">Catálogo</a></li>
        <li><a href="https://papelerapierrastegui.com.ar/contacto">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="producto container">
      <div class="producto-contenido">
        <img id="producto-img"
          src="https://mediastatic.papelerapierrastegui.com.ar/assets/images/Fotos%20productos%20papelera%20para%20cat%C3%A1logo/CUBIERTOS-PLATOS/sorbetes%20descartables%20negros.jpg"
          alt="Sorbetes Negros">
        <div class="producto-info">
          <h2>Sorbetes Negros</h2>
          <ul>
            <li>Sorbetes descartables negros.</li>
            <li>Diseño elegante y resistente.</li>
          </ul>

          <div class="agregar-carrito-cantidad">
            <button id="decrementar">-</button>
            <span id="cantidad-visual">1</span>
            <button id="incrementar">+</button>
          </div>

          <p class="total">Total: $0</p>
          <button class="agregar-carrito">Agregar al Carrito</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cantidadVisual = document.getElementById('cantidad-visual');
      const decBtn = document.getElementById('decrementar');
      const incBtn = document.getElementById('incrementar');
      const totalDisplay = document.querySelector('.total');

      const precioUnitario = 900;
      let cantidad = 1;

      function updateTotal() {
        const total = cantidad * precioUnitario;
        totalDisplay.textContent = `Total: $${total.toLocaleString('es-AR')}`;
      }

      incBtn.addEventListener('click', () => {
        cantidad++;
        cantidadVisual.textContent = cantidad;
        updateTotal();
      });

      decBtn.addEventListener('click', () => {
        if (cantidad > 1) cantidad--;
        cantidadVisual.textContent = cantidad;
        updateTotal();
      });

      updateTotal();
    });
  </script>
  <footer>
    <div class="container-footer">
      <p>2025 © Papelera Pierrastegui</p>
      <p>2025 © Sol Argentino TV | Creado por los desarrolladores de Sol Argentino TV</p>
    </div>
  </footer>
</body>

</html>
