<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Papelera Pierrastegui - Papel Aluminio</title>
  <link rel="icon" href="../../assets/images/favicon.png" type="image/x-icon" />
  <link rel="stylesheet" href="../../assets/css/productos.css" />
  <link rel="stylesheet" href="../../assets/css/dropdown.css" />
  <style>
    .dropdown-menu {
      height: 5.5em !important;
    }

    #contenedor {
      width: 20em;
      height: 20em;
      position: relative;
      margin-bottom: 3em !important;
    }

    #contenedor img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
      display: block;
      /* siempre block para que esté en flujo */
      pointer-events: none;
      /* para que no interfiera */
    }

    #contenedor img.visible {
      opacity: 1;
      pointer-events: auto;
      z-index: 1;
    }
  </style>
</head>

<body>
  <header>
    <h1>Papelera Pierrastegui</h1>
    <nav>
      <ul>
        <li><a href="../../index.html">Inicio</a></li>
        <li><a href="../../catalogo.html">Catálogo</a></li>
        <li><a href="../../contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="producto-detalle">
      <h2>Papel Aluminio</h2>
      <div class="producto-detalle">
        <div id="contenedor">
          <img
            src="https://papelerapierrastegui.com.ar/assets/images/Fotos%20productos%20papelera%20para%20cat%C3%A1logo/ALUMINIO/aluminio%205%20mts.jpg"
            alt="Papel Aluminio" />
          <img src="https://papelerapierrastegui.com.ar/assets/images/aluminio.jpg" alt="Papel Aluminio">
        </div>
        <div class="producto-info">
          <h3>Descripción del Producto</h3>
          <p>Papel aluminio disponible en tamaño chico y presentación de 1kg.</p>

          <div class="dropdown">
            <button class="dropdown-btn">Seleccionar Tamaño</button>
            <ul class="dropdown-menu" style="height: 5.5em;">
              <li data-tamaño="chico">5 Mts</li>
              <li data-tamaño="1kg">1Kg</li>
            </ul>
          </div>

          <div id="uni" style="display: none;">
            <p class="precio"></p>
          </div>

          <button class="agregar-carrito">Agregar al carrito</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>2025 © Papelera Pierrastegui</p>
    <p>2025 © Sol Argentino TV | Creado por los desarrolladores de Sol Argentino TV</p>

    <div class="social-icons">
      <a href="https://www.facebook.com/papelerapierrastegui" target="_blank" aria-label="Facebook"
        rel="noopener noreferrer">
        <img src="https://papelerapierrastegui.com.ar/assets/images/svg/social/facebook.svg" alt="Facebook">
      </a>

      <a href="https://www.instagram.com/papelerapierrastegui" target="_blank" aria-label="Instagram"
        rel="noopener noreferrer">
        <img src="https://papelerapierrastegui.com.ar/assets/images/svg/social/instagram.svg" alt="Instagram">
      </a>

      <a href="https://twitter.com/pierrastegui" target="_blank" aria-label="Twitter" rel="noopener noreferrer">
        <img src="https://papelerapierrastegui.com.ar/assets/images/svg/social/twitter.svg" alt="Twitter">
      </a>

      <a href="https://wa.me/5491122334455" target="_blank" aria-label="WhatsApp" rel="noopener noreferrer">
        <img src="https://papelerapierrastegui.com.ar/assets/images/svg/social/whatsapp.svg" alt="WhatsApp">
      </a>
    </div>
  </footer>


  <!-- Script para reemplazar dinámicamente los href -->
  <script src="../../assets/js/social-links.js"></script>
  <script src="../../assets/js/dropdown.js"></script>
  <script src="../../assets/js/preciosdrop-aluminio.js"></script>
  <script>
    const imgs = document.querySelectorAll('#contenedor img');
    let index = 0;
    let direccion = 1;

    // Mostrar la primera imagen desde el inicio
    imgs[index].classList.add('visible');

    // Esperar 3 segundos antes de comenzar el ciclo
    setTimeout(() => {
      setInterval(() => {
        imgs[index].classList.remove('visible');

        index += direccion;

        // Cambiar dirección si estamos al final o al inicio
        if (index === imgs.length - 1 || index === 0) {
          direccion *= -1;
        }

        imgs[index].classList.add('visible');
      }, 3000);
    }, 3000); // <- este es el periodo de gracia inicial en milisegundos
  </script>
</body>

</html>
