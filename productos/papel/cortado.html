<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papelera Pierrastegui - Papel Sulfito Cortado</title>
    <link rel="icon" href="../../assets/images/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="../../assets/css/productos.css">
    <link rel="stylesheet" href="../../assets/css/dropdown.css">
</head>
<body>
    <header>
        <h1>Papelera Pierrastegui</h1>
        <nav>
            <ul>
                <li><a href="../../index.html">Inicio</a></li>
                <li><a href="../../catalogo.html">Catálogo</a></li>
                <li><a href="../../contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="producto-detalle">
            <h2>Papel Sulfito Cortado</h2>
            <div class="producto-detalle">
                <img src="https://papelerapierrastegui.com.ar/assets/images/Fotos%20productos%20papelera%20para%20cat%C3%A1logo/PAPEL%20SULFITO/Papel%20cortado.webp" alt="Papel Sulfito Cortado">
                <div class="producto-info">
                    <h3>Descripción del Producto</h3>
                    <p>Papel sulfito cortado en distintas medidas. Ideal para embalaje, envoltorio y uso general.</p>

                    <div class="dropdown">
                        <button class="dropdown-btn">Seleccionar Medida</button>
                        <ul class="dropdown-menu" style="height: 11em;">
                            <li data-medida="35x45">35x45</li>
                            <li data-medida="40x50">40x50</li>
                            <li data-medida="50x70">50x70</li>
                            <li data-medida="60x90">60x90</li>
                        </ul>
                    </div>

                    <div id="uni" style="display: none;">
                        <p class="precio">
                            Por 1KG: <span id="precio-unidad"></span> <span id="precio-unidad-moneda"></span>
                        </p>
                        <p class="precio">
                            Por 20KG: <span id="precio-20"></span> <span id="precio-20-moneda"></span>
                        </p>
                    </div>

                    <p id="sin-stock" class="precio" style="display: none; font-weight: 700;"></p>

                    <button class="agregar-carrito">Agregar al carrito</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>2025 © Papelera Pierrastegui</p>
    </footer>

    <script src="../../assets/js/dropdown.js"></script>
    <script src="../../assets/js/preciosdrop-cortado.js"></script>
</body>
</html>
