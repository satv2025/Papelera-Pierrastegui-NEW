<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login - Papelería Pierrastegui</title>

    <!-- Tu CSS remoto -->
    <link rel="stylesheet" href="https://papelerapierrastegui.com.ar/assets/css/reg_logueo_pp.css">
</head>

<body>
    <div class="form-container">
        <h2>INICIA SESIÓN</h2>

        <div id="login-fields">
            <!-- custom "inputs" (NO <input>) -->
            <div class="custom-input" data-key="email" data-password="false" data-placeholder="Correo electrónico"
                tabindex="0"></div>
            <div class="custom-input" data-key="password" data-password="true" data-placeholder="Contraseña"
                tabindex="0"></div>

            <button id="btn-login" type="button">Iniciar Sesión</button>
            <button id="btn-login-google" type="button">Iniciar con Google</button>

            <hr style="margin: 1rem 0; border: none; border-top:1px solid #ffd6b3;" />
            <button id="btn-register-page" type="button">Ir a Registro</button>
        </div>
    </div>

    <!-- Usa exactamente los scripts remotos que pediste -->
    <script type="module" src="https://papelerapierrastegui.com.ar/assets/js/auth.js"></script>
    <script type="module" src="https://papelerapierrastegui.com.ar/assets/js/functionality.js"></script>
    <script type="module" src="https://papelerapierrastegui.com.ar/assets/js/togglePassword.js"></script>
</body>

</html>
