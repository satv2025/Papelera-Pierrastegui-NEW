<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://papelerapierrastegui.com.ar/assets/css/reg_loqueo_pp.css">
</head>

<body>
    <div class="form-container">
        <h2>INICIA SESIÓN</h2>

        <div id="login-fields">
            <div class="custom-input" data-key="email" placeholder="Correo electrónico"></div>
            <div class="custom-input" data-key="password" placeholder="Contraseña" data-password="true"></div>
            <button id="btn-login">Iniciar Sesión</button>
            <button id="btn-login-google">Login con Google</button>
            <button id="btn-register-page">Ir a Registro</button>
        </div>
    </div>

    <script type="module" src="https://papelerapierrastegui.com.ar/assets/js/auth.js"></script>
    <script type="module" src="https://papelerapierrastegui.com.ar/assets/js/togglePassword.js"></script>
</body>

</html>
