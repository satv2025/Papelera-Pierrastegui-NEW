<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Nos estamos renovando</title>

        <style>
            @import url('https://solargentinotv.com.ar/assets/fonts/Gilroy/Gilroy.css');

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: Gilroy;
            }

            body {
                background: #fff;
                height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            /* TEXTOS */
            h1 {
                font-size: 3rem;
                color: #ff7600;
                font-weight: 900;
                text-align: center;
            }

            .subtitle {
                margin-top: 10px;
                opacity: 0.6;
                text-align: center;
            }

            .small {
                margin-top: 10px;
                font-size: 0.9rem;
                opacity: 0.5;
                text-align: center;
            }

            /* ANIMACION */
            #animation {
                width: 360px;
                height: 360px;
                margin: 20px 0;
            }

            /* FOOTER */
            .footer {
                position: absolute;
                bottom: 10px;
                text-align: center;
                font-size: 0.75rem;
                opacity: 0.6;
            }
        </style>
    </head>

    <body>

        <h1>Nos estamos renovando</h1>
        <div class="subtitle">En mantenimiento</div>

        <div id="animation"></div>

        <div class="small">Reapertura: Pronto</div>

        <div class="footer">
            Papelera Pierrastegui © 2026<br>
            Sol Argentino TV Group 2020–2026
        </div>

        <!-- LOTTIE -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

        <script>
            lottie.loadAnimation({
                container: document.getElementById('animation'),
                renderer: 'svg',
                loop: true,
                autoplay: true,

                /* ESTA SÍ es de construcción */
                path: 'https://assets1.lottiefiles.com/packages/lf20_0yfsb3a1.json'
            });
        </script>

    </body>

</html>
