<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Papelera Pierrastegui</title>

    <link href="assets/css/inicio.css" rel="stylesheet" />
    <link href="assets/css/dropcart-home.css" rel="stylesheet" />

    <link rel="icon" href="https://mediastatic.papelerapierrastegui.com.ar/assets/images/favicon1.ico" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://solargentinotv.com.ar/assets/js/sb.js"></script>
</head>

<body>

    <!-- ================= HEADER ORIGINAL COMPLETO ================= -->
    <header>

        <!-- IZQUIERDA -->
        <div class="pp-logo" id="pp-logo">
            <a href="/">
                <img class="pp-logo-svg"
                    src="https://mediastatic.papelerapierrastegui.com.ar/assets/images/favicon1.ico">
                <span class="pp-name">Papelera<br>Pierrastegui</span>
            </a>
        </div>

        <!-- CENTRO -->
        <div class="search-bar">
            <input id="search-input" placeholder="Buscar productos..." type="text">
            <img src="https://mediastatic.papelerapierrastegui.com.ar/assets/images/svg/web/lupa2.svg">
        </div>

        <!-- DERECHA -->
        <div class="nav-links">

            <!-- MAIL -->
            <div class="mail">
                <a class="icon-text" href="mailto:info@papelerapierrastegui.com.ar">
                    <span id="red">Contactános<br>Por Mail</span>
                    <img class="mail-icon"
                        src="https://mediastatic.papelerapierrastegui.com.ar/assets/images/svg/social/email.svg">
                </a>
            </div>

            <!-- IG -->
            <div class="ig">
                <a class="icon-text" href="https://www.instagram.com/pierrastegui.papelera" target="_blank">
                    <span id="red">Seguinos<br>En Instagram</span>
                    <img class="icon-right"
                        src="https://mediastatic.papelerapierrastegui.com.ar/assets/images/svg/social/instagram.svg">
                </a>
            </div>

            <!-- WP -->
            <div class="wp">
                <a class="icon-text" href="https://wa.me/541123054613" target="_blank">
                    <span id="red">Contactános<br>Por Whatsapp</span>
                    <img class="icon-right"
                        src="https://mediastatic.papelerapierrastegui.com.ar/assets/images/svg/social/whatsapp.svg">
                </a>
            </div>

            <!-- ================= CARRITO ================= -->
            <div class="carrito-pro dropcart-container">

                <div class="icon-text cart-trigger" id="cart-toggle">
                    <span id="red">Carrito</span>
                    <img class="cart-icon"
                        src="https://mediastatic.papelerapierrastegui.com.ar/assets/images/svg/web/carrito.svg">
                    <span class="cart-badge" id="cart-badge">0</span>
                </div>

                <div class="dropcart" id="dropcart">
                    <div class="dropcart-header">
                        <strong>Tu Carrito</strong>
                        <button id="dropcart-close">✕</button>
                    </div>

                    <div class="dropcart-items" id="dropcart-items">
                        <p class="empty">Tu carrito está vacío</p>
                    </div>

                    <div class="dropcart-footer">
                        <div class="dropcart-total">
                            <span>Total:</span>
                            <strong id="dropcart-total">$0</strong>
                        </div>
                        <div class="dropcart-actions">
                            <button id="dropcart-empty" class="btn-ghost">Vaciar</button>
                            <a href="/checkout" class="btn-primary">Finalizar</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ================= LOGIN ================= -->
            <div class="mi-cuenta">
                <div id="mi-cuenta-container"></div>
                <img class="icon-right"
                    src="https://mediastatic.papelerapierrastegui.com.ar/assets/images/svg/web/account.svg">
            </div>

        </div>

    </header>

    <!-- línea naranja -->
    <div class="header-divider"></div>

    <!-- ================= NAV DINÁMICO (SIN HARDCODEO) ================= -->
    <nav class="main-navbar">
        <div class="nav-items" id="categoriasNav"></div>
    </nav>


    <!-- ================= PRODUCTOS ================= -->
    <main class="wrap-home">
        <div id="productos-grid" class="productos-grid"></div>
    </main>


    <!-- ================= JS PRODUCTOS ================= -->
    <script>
        /* =================================================
           PAPELERA PIERRASTEGUI - APP GLOBAL JS
           Maneja:
           - Supabase
           - Login/Cuenta
           - Carrito dropdown
           - Productos grid + buscador
        ================================================= */


        /* ========= ESPERAR DOM ========= */
        document.addEventListener("DOMContentLoaded", () => {

            /* =================================================
               SUPABASE
            ================================================= */
            const sb = window.sb; // viene de sb.js CDN


            /* =================================================
               LOGIN / CUENTA
            ================================================= */
            const cuentaContainer = document.getElementById("mi-cuenta-container");

            async function renderCuenta() {
                if (!cuentaContainer) return;

                const { data } = await sb.auth.getSession();
                const user = data.session?.user;

                cuentaContainer.innerHTML = "";

                if (user) {
                    const nombre = user.email;

                    const btn = document.createElement("button");
                    btn.className = "btn-login";
                    btn.textContent = nombre;

                    const logout = document.createElement("button");
                    logout.className = "btn-login";
                    logout.textContent = "Salir";

                    logout.onclick = async () => {
                        await sb.auth.signOut();
                        location.reload();
                    };

                    cuentaContainer.append(btn, logout);

                } else {
                    const login = document.createElement("button");
                    login.className = "btn-login";
                    login.textContent = "Acceder";
                    login.onclick = () => location.href = "/login";

                    cuentaContainer.append(login);
                }
            }

            renderCuenta();



            /* =================================================
               CARRITO DROPDOWN
            ================================================= */
            const toggle = document.getElementById("cart-toggle");
            const cart = document.getElementById("dropcart");
            const close = document.getElementById("dropcart-close");

            if (toggle && cart) {

                toggle.addEventListener("click", () => {
                    cart.classList.toggle("show");
                });

                close?.addEventListener("click", () => {
                    cart.classList.remove("show");
                });

                window.addEventListener("click", (e) => {
                    if (!cart.contains(e.target) && !toggle.contains(e.target)) {
                        cart.classList.remove("show");
                    }
                });
            }



            /* =================================================
               PRODUCTOS HOME
            ================================================= */
            const grid = document.getElementById("productos-grid");
            const search = document.getElementById("search-input");

            if (!grid) return; // si no estamos en home, salir


            function slugify(str) {
                return str
                    .toLowerCase()
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .replace(/\s+/g, "-");
            }


            async function cargarProductos() {

                const { data, error } = await sb
                    .from("productos")
                    .select("*")
                    .eq("activo", true)
                    .order("orden");

                if (error) return console.error(error);

                renderProductos(data);

                search?.addEventListener("input", () => {
                    const q = search.value.toLowerCase();

                    const filtrados = data.filter(p =>
                        p.nombre.toLowerCase().includes(q)
                    );

                    renderProductos(filtrados);
                });
            }


            function renderProductos(list) {

                grid.innerHTML = "";

                list.forEach(p => {

                    grid.insertAdjacentHTML("beforeend", `
        <a class="card-prod"
           href="/producto?name=${slugify(p.nombre)}&id=${p.id}">
          <img src="${p.imagen || ''}">
          <h3>${p.nombre}</h3>
          <small>${p.categoria || ''}</small>
        </a>
      `);

                });
            }


            cargarProductos();

        });
    </script>
</body>

</html>
